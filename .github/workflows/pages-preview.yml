name: Publish beta and PR previews

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable beta
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assemble beta and open pull request previews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/previews
          tar --exclude=.git --exclude=.github --exclude=_site -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          gh pr list --state open --limit 30 --json number,headRefOid,isCrossRepository > /tmp/cadd-prs.json
          jq -c '.[] | select(.isCrossRepository == false)' /tmp/cadd-prs.json | while read -r pr; do
            number=$(jq -r '.number' <<< "$pr")
            sha=$(jq -r '.headRefOid' <<< "$pr")
            echo "Preparing preview for PR #$number ($sha)"
            git fetch --no-tags --depth=1 origin "$sha"
            mkdir -p "_site/previews/pr-$number"
            git archive FETCH_HEAD | tar -xf - -C "_site/previews/pr-$number"
            touch "_site/previews/pr-$number/.nojekyll"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
